name: Check Pawl GPS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: node --check app.js && node --check settings.js && node --check gps.js && node --check actions.js && node --check assist.js && node --check runtime.js && node --check interface-client.js
